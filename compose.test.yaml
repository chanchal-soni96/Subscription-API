
services:
  test-db:
    image: postgres:16
    environment:
      POSTGRES_DB: subscription_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"  #Host port:container port
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d subscription_test"]
      interval: 5s
      timeout: 5s
      retries: 10
